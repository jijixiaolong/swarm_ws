#########################################################################
# FSM PX4 Control Parameters #
#########################################################################

# 使用通配节点名，确保 fsmpx4_fsm_px4_1/2/3 等多实例都能加载同一套默认参数
/**:
  ros__parameters:
    # 基础参数
    ctrl_freq_max: 200.0
    px4_ns: "" # 多机时填写 "/px4_1"、"/px4_2"...
    manual_control_topic: false # true=use /<px4_ns>/fmu/out/manual_control_setpoint, false=use /rc/manual_control_setpoint or /<px4_ns>/rc/manual_control_setpoint

    # 位置输入参数: 使用 /fmu/out/vehicle_global_position (px4_msgs/msg/VehicleGlobalPosition)
    # 下面的经纬高会作为所有无人机共享的 NED 原点，请按实际起飞参考点填写。
    "position.gps_origin_latitude_deg": 47.397742
    "position.gps_origin_longitude_deg": 8.545594
    "position.gps_origin_altitude_m": 488.0

    # 自动起飞参数（仅在 OFFBOARD_STABILIZED -> HOVER 入口时触发）
    "takeoff.enabled": true
    "takeoff.idle_duration_s": 1.0
    "takeoff.target_height_m": 0.7
    "takeoff.ascent_velocity_m_s": 0.6
    "takeoff.timeout_s": 10.0

    # 自动降落参数
    "land.detected_ready_timeout_s": 2.0
    "land.command_resend_interval_s": 0.2
    "land.disarm_command_resend_interval_s": 0.2
    "land.disarm_command_hold_s": 1.0

    # VehicleCommand 源/目标ID
    "vehicle_command.target_system_id": 1
    "vehicle_command.target_component_id": 1
    "vehicle_command.source_system_id": 1
    "vehicle_command.source_component_id": 1

    # 推力映射参数
    # 实测 AUTO_HOVER 稳定悬停推力 ≈ 0.70（t≈49.7s vel_z≈0 时 thrust=-0.714）
    # 配置须与实际悬停推力一致；偏高则持续上爬，偏低则缓慢下沉（下沉可被 Z 积分补偿，上爬无法补偿）
    "thr_map.hover_percentage": 0.70

    # 控制器参数 - 位置控制增益
    "control.Kp_x": 2.5
    "control.Kp_y": 2.5
    "control.Kp_z": 4.0
    "control.Kv_x": 3.0
    "control.Kv_y": 3.0
    "control.Kv_z": 4.5
    "control.Kvi_x": 0.02
    "control.Kvi_y": 0.02
    "control.Kvi_z": 0.1

    # 控制器参数 - 物理参数
    "control.mass": 2.0
    "control.gravity": 9.81

    # 控制器参数 - 控制限制
    "control.max_thrust": -0.1 # 最大推力 (向上)
    "control.min_thrust": -0.9 # 最小推力 (向下)

    # 控制器参数 - 积分控制 (暂时关闭，先稳定基础控制)
    "control.use_integral": false

    # 编队规划参数
    "swarm.uav_namespaces": ["/px4_1", "/px4_2", "/px4_3"]
    "swarm.self_index": 0
    "swarm.mass": 2.0
    "swarm.target_x_m": 1.0
    "swarm.target_y_m": 1.0
    "swarm.target_z_m": -1.5
    "swarm.payload_global_position_topic": "/px4_4/fmu/out/vehicle_global_position"
    "swarm.payload_local_position_topic": "/px4_4/fmu/out/vehicle_local_position"
    "swarm.data_timeout_s": 0.5
    "swarm.rope_length_m": 1.35 # 实测中心距（机体中心→payload中心）≈1.35m；物理绳长≈1.15m+挂点偏置≈0.20m
    "swarm.rope_taut_fraction": 0.74 # 1.0m / 1.35m ≈ 0.74，达到此距离视为绷紧
    "swarm.h_u_m": 0.9 # 虚拟弹簧设计高度，须 < 启动时实际 dz（≈0.9m），保证 beta>1 且弹簧方向正确；Z 轴稳态误差靠 payload_ki 积分消除
    "swarm.structure_reference.side_length_m": 1.10 # 真实三机等边三角参考边长；虚拟节点参考矩阵由 side_length+h_u 自动生成
    "swarm.spring_k": 2.0 # spring_k=4.0 时进入 FORM_HOLD 瞬间产生 2.6 m/s² spike，配合错误 hover 基准直接导致上飞；维持 2.0
    "swarm.spring_force_clamp": 1.0 # [FIX-P5] 1.5→1.0 更紧的力钳制，限制大摆角时的弹簧冲击
    "swarm.damping_c1": 0.9 # [FIX-P5] 0.9→1.2 增大相对速度阻尼，抑制节点间振荡
    
    "swarm.friction_c2": 0.4 # [FIX-P5] 0.2→0.4 增大绝对速度摩擦，全局耗散翻倍
    "swarm.vel_pid_kp": 1.4 # [FIX-P5] 2.0→1.2 降低内环带宽，远离摆振频率(2.7 rad/s)
    "swarm.vel_pid_ki": 0.02 # [FIX-P5] 0.05→0.02 大幅减小积分，防止windup导致反弹
    "swarm.vel_pid_kd": 0.3 # [FIX-P5] 0.2→0.3 增大微分阻尼，抑制速度振荡
    "swarm.payload_kp": 1.2 # [FIX-P5] 2.5→1.2 外环带宽大幅降低：ω_outer≈0.6 rad/s ≪ ω_pendulum=2.7
    "swarm.payload_ki": 0.15 # [FIX-P5] 0.1→0.15 增大积分消除Z静差(实测-0.135m)
    "swarm.acc_norm_limit_m_s2": 3.0 # [FIX-P5] 4.0→3.0 降低最大加速度，减少激进机动
    "swarm.integral_limit": 1.0 # [FIX-P5] 2.0→1.0 收紧速度积分限幅，减少windup储能
    "swarm.payload_integral_limit": 4.0
    "swarm.max_payload_velocity": 0.5 # [FIX-P5] 新增：期望速度限幅，防止大误差→高速→超调的正反馈
    "swarm.payload_error_limit_xy_m": 0.3 # [FIX-P5] 0.5→0.3 更紧的位置误差钳制
    "swarm.payload_error_limit_z_m": 0.8 # [FIX-P5] 5.0→0.8 Z轴也必须限制！旧值形同虚设导致Z轴2.66m/s冲击

    # 编队收敛门控参数：按真实 4 节点距离矩阵（3 UAV + payload）误差判断是否可切入 PAYLOAD_TRACK
    # 其中 UAV-UAV 走结构参考边长，UAV-payload 走 rope_length_m。
    "swarm.formation_gate.enabled": true
    "swarm.formation_gate.struct_err_max": 0.3 # 6 条真实边的最大相对误差 ≤ 20%
    "swarm.formation_gate.hold_duration_s": 1.0 # 连续满足后再保持 2s 才切换
